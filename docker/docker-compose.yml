version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: oms_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: oms_db
    ports:
      - "5432:5432"
    volumes:
      - ../db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ../db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql